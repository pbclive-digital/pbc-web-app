<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBC</title>
    <link type="text/css" rel="stylesheet" href="styles.css">

    <!-- Google Identity -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBd0nEi3ieB8lGP71_OU--Jpl01Qcr8NmA",
            authDomain: "pbc-live-staging-8bd3e.firebaseapp.com",
            projectId: "pbc-live-staging-8bd3e",
            appId: "1:944081515646:web:4a1b6cabd0e12f6e88942f",
            storageBucket: "pbc-live-staging-8bd3e.firebasestorage.app",
            messagingSenderId: "944081515646",
            measurementId: "G-WP01SY582P"
        };

        window.firebaseApp = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(window.firebaseApp);

        console.log("✅ Firebase initialized", window.firebaseAuth);

        // Holds current firebase user
        window.currentFirebaseUser = null;

        // Subscribe to auth changes
        window.subscribeAuthState = (callback) => {
            const unsubscribe = window.firebaseAuth.onAuthStateChanged(user => {
                window.currentFirebaseUser = user;
                console.log("🔥 Auth state changed:", user);
                callback(user);
            });

            return unsubscribe;
        };
    </script>

    <script type="module">
        import { GoogleAuthProvider, signInWithCredential }
          from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        window.FirebaseAuth = {
          signInWithGoogle: async (idToken) => {
            if (!window.firebaseAuth) {
                console.error("❌ firebaseAuth is not initialized");
                return;
            }

            try {
                const credential = GoogleAuthProvider.credential(idToken);
                const result = await signInWithCredential(window.firebaseAuth, credential);
                console.log("✅ Firebase login success:", result.user);
            } catch (e) {
                console.error("❌ Firebase login failed:", e);
            }
          }
        };

        window.signOutFirebase = () => {
            console.log("🚪 Signing out user...");
            return window.firebaseAuth.signOut();
        };
    </script>
