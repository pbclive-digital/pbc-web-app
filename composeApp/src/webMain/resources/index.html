<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBC</title>
    <!-- Standard Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <!-- Add style css -->
    <link type="text/css" rel="stylesheet" href="styles.css">

    <!-- Google Identity -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="firebase-config.js"></script>

    <script>
        var firebaseConfig = window.firebaseConfig || {};
        console.log("Firebase Config Loaded:", window.firebaseConfig);
    </script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        window.firebaseApp = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(window.firebaseApp);

        console.log("✅ Firebase initialized", window.firebaseAuth);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Expose a function to the window so Kotlin can call it
        window.signInWithGoogle = async function() {
          const provider = new GoogleAuthProvider();
          try {
            const result = await signInWithPopup(auth, provider);
            return result.user.displayName; // Or return the whole user object as JSON
          } catch (error) {
            console.error("Auth Error:", error);
            throw error;
          }
        };

        // Holds current firebase user
        window.currentFirebaseUser = null;

        // Subscribe to auth changes
        window.subscribeAuthState = (callback) => {
            const unsubscribe = window.firebaseAuth.onAuthStateChanged(user => {
                window.currentFirebaseUser = user;
                console.log("🔥 Auth state changed:", user);
                callback(user);
            });

            return unsubscribe;
        };

        window.signOutFirebase = () => {
            console.log("🚪 Signing out user...");
            return window.firebaseAuth.signOut();
        };
    </script>
</head>
<body style="text-align: center; align-content: center">
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
    <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
    <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
            stroke-dasharray="90 125">
        <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                          repeatCount="indefinite"/>
    </circle>
</svg>
<script type="application/javascript" src="composeApp.js"></script>
</body>
</html>
